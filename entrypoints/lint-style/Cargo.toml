[package]
name = "omnius-core-lint-style"
version = "0.1.0"
edition = "2024"
authors = ["Lyrise <lyrise1984@gmail.com>"]
publish = false

[[bin]]
name = "lint-style"
path = "src/main.rs"

# Dependencies are not resolved from the workspace.
# This crate is also taken into the pxna and axus workspaces as a member,
# so if the version or features drift per workspace, the check results change silently.
# In particular, without the span-locations feature of proc-macro2, line numbers become 0.
[dependencies]
anyhow = "1.0.101"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
toml = "1.0.6"
walkdir = "2.5.0"
