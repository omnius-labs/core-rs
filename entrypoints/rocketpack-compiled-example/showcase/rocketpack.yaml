version: 1
name: rocketpack-showcase-schema

sources:
  - base_dir: rpfs
    includes:
      - "**/*.rpf"
    excludes:
      - "**/*.test.rpf"

generators:
  - id: csharp
    plugin: rocketpack-csharp
    options:
      target_framework: net8.0
      visibility: public
      partial_types: true
      base_namespace: Company.Project
      file_extension: .g.cs
    targets:
      - pattern: showcase.rpf
        options:
          dir: csharp/gen/src/showcase
      - pattern: "*.rpf"
        options:
          dir: csharp/gen/src/common
          visibility: internal

  - id: rust
    plugin: rocketpack-rust
    options:
      output_dir: rust/gen/src
      module_name: rocketpack

  - id: swift
    plugin: rocketpack-swift
    options:
      swift_version: 6.x
      visibility: public
    targets:
      - pattern: showcase.rpf
        options:
          dir: swift/gen/src/showcase
      - pattern: "*.rpf"
        options:
          dir: swift/gen/src/common
          visibility: internal
